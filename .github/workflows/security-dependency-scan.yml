name: Security Dependency Scan

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main
      - feature/**
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  dependency-scan-policy:
    name: Dependency scan (HIGH/CRITICAL gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy dependency scan (policy gate)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln
          vuln-type: library
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          skip-dirs: |
            backend/**/target
            frontend/dist

  dependency-scan-report:
    name: Dependency scan report (SARIF)
    runs-on: ubuntu-latest
    needs: dependency-scan-policy
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy dependency scan (SARIF)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln
          vuln-type: library
          format: sarif
          output: trivy-dependencies.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 0
          skip-dirs: |
            backend/**/target
            frontend/dist

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-dependencies.sarif
