server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ── Headers globais para Firebase Google Sign-In (popup) ──
    # same-origin-allow-popups permite que o popup do Google se comunique de volta
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # ── Proxy reverso para API Gateway ──
    # O frontend chama /api/... e o Nginx encaminha para o api-gateway container
    # Isso evita Mixed Content (HTTPS frontend → HTTP api) e expor IP interno
    # CORS é gerenciado INTEIRAMENTE pelo gateway (globalcors no application.yml)
    # Nginx NÃO deve adicionar headers CORS para evitar duplicação
    location /api/ {
        proxy_pass http://gateway:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }

    # ── SPA — redireciona todas as rotas para index.html ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Desabilitar cache para index.html (SPA precisa sempre buscar a versão mais recente)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
