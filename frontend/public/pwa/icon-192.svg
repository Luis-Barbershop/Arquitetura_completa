<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192" role="img" aria-label="CortaAi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0f0f0f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8d6308"/>
    </linearGradient>
  </defs>
  <!-- Fundo arredondado escuro -->
  <rect x="0" y="0" width="192" height="192" rx="42" fill="url(#bg)"/>
  <!-- Borda dourada sutil -->
  <rect x="3" y="3" width="186" height="186" rx="40" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.6"/>
  <!-- Tesoura estilizada — lâmina esquerda -->
  <g transform="translate(96,96)" fill="url(#gold)">
    <!-- pino central -->
    <circle cx="0" cy="0" r="7"/>
    <!-- lâmina 1 -->
    <path d="M-4,-6 L-32,-60 Q-36,-70 -28,-68 L-2,2 Z" opacity="0.95"/>
    <!-- lâmina 2 -->
    <path d="M4,-6 L32,-60 Q36,-70 28,-68 L2,2 Z" opacity="0.95"/>
    <!-- alça 1 -->
    <ellipse cx="-28" cy="52" rx="14" ry="20" fill="none" stroke="url(#gold)" stroke-width="6"/>
    <!-- alça 2 -->
    <ellipse cx="28" cy="52" rx="14" ry="20" fill="none" stroke="url(#gold)" stroke-width="6"/>
    <!-- hastes das alças -->
    <rect x="-32" y="4" width="6" height="30" rx="3"/>
    <rect x="26" y="4" width="6" height="30" rx="3"/>
  </g>
  <!-- Texto CortaAi pequeno em baixo -->
  <text x="96" y="180" text-anchor="middle" fill="#c19006" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2">CortaAi</text>
</svg>
