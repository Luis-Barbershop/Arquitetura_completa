sonar.projectKey=AppCortaAi_Arquitetura_completa
sonar.organization=appcortaai

# Módulos Maven — cada microsserviço é um módulo
sonar.modules=user-service,barbershop-service,schedule-service,payment-service,product-service,notification-service

# Raízes dos módulos
user-service.sonar.projectBaseDir=backend/user-service
barbershop-service.sonar.projectBaseDir=backend/barbershop-service
schedule-service.sonar.projectBaseDir=backend/schedule-service
payment-service.sonar.projectBaseDir=backend/payment-service
product-service.sonar.projectBaseDir=backend/product-service
notification-service.sonar.projectBaseDir=backend/notification-service

# Fontes e testes (padrão Maven)
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes

# JaCoCo — relatório gerado por mvn verify
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Exclusões (gerados, configs, infra)
sonar.exclusions=**/config/**,**/exception/GlobalExceptionHandler.java,**/*Application.java,**/dto/**,**/model/**,**/mapper/**
sonar.coverage.exclusions=**/config/**,**/*Application.java,**/dto/**,**/model/**,**/mapper/**,**/messaging/publisher/**

# Java 17
sonar.java.source=17

# ─────────────────────────────────────────────────────────────────
# NOTA: este arquivo é usado pelo SonarScanner CLI standalone.
# Para análise via Maven (recomendado), use:
#   cd backend && mvn verify sonar:sonar -Dsonar.token=SEU_TOKEN
# ou com variável de ambiente:
#   $env:SONAR_TOKEN="seu_token"; cd backend; mvn verify sonar:sonar
# ─────────────────────────────────────────────────────────────────
