server:
  port: 8081 # Porta diferente do Gateway (8080) e Discovery (8761)

spring:
  application:
    name: user-service # Nome usado pelo Gateway (lb://user-service) e Eureka

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/user_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update # Cria/Atualiza as tabelas automaticamente
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        show_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# ==================================================
# FIREBASE AUTHENTICATION
# ==================================================
firebase:
  # JSON completo da Service Account (para produção via Docker / env var)
  # Deixe vazio para usar GOOGLE_APPLICATION_CREDENTIALS (arquivo montado como volume)
  service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}

error:
  handling:
    http-status-in-json-response: true
    full-stacktrace-http-statuses: 5xx

cloudinary:
  cloud_name: ${CLOUDINARY_CLOUD_NAME:}
  api_key: ${CLOUDINARY_API_KEY:}
  api_secret: ${CLOUDINARY_API_SECRET:}
