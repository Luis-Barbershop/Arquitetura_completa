server:
  port: 8081
  # Reduz threads do Tomcat para economizar RAM (~1MB por thread)
  tomcat:
    threads:
      max: 20
      min-spare: 2
    max-connections: 100

spring:
  application:
    name: user-service
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  cloud:
    openfeign:
      client:
        config:
          barbershop-service:
            connectTimeout: 2000
            readTimeout: 3000
    loadbalancer:
      cache:
        type: caffeine
        caffeine:
          spec: maximumSize=1000,expireAfterWrite=5s
  main:
    lazy-initialization: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/user_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # HikariCP - pool menor para reduzir RAM
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 600000

  jpa:
    # Hibernate 6+ detecta o dialeto automaticamente pelo driver — não especificar
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        show_sql: false
        # Força UUID como VARCHAR(36) em vez de BINARY(16) no MySQL
        type:
          preferred_uuid_jdbc_type: CHAR
        # Reduz tamanho do batch em memória
        jdbc:
          batch_size: 10
        order_inserts: true
        order_updates: true

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# ==================================================
# FIREBASE AUTHENTICATION
# ==================================================
firebase:
  # Deixe vazio — o Firebase é carregado via GOOGLE_APPLICATION_CREDENTIALS
  # (arquivo firebase-service-account.json montado como volume no Docker)
  service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
  # API key web do projeto Firebase (necessaria para signInWithPassword)
  web-api-key: ${FIREBASE_WEB_API_KEY:}

error:
  handling:
    http-status-in-json-response: true
    full-stacktrace-http-statuses: 5xx

cloudinary:
  cloud_name: ${CLOUDINARY_CLOUD_NAME:}
  api_key: ${CLOUDINARY_API_KEY:}
  api_secret: ${CLOUDINARY_API_SECRET:}

# ==================================================
# SPRINGDOC / SWAGGER UI
# ==================================================
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    servers-order: first
  api-docs:
    path: /v3/api-docs
  servers:
    # Swagger "Try it out" envia as requests pelo gateway, não direto para a porta 8081
    - url: ${SPRINGDOC_SERVER_URL:http://localhost:8080}
      description: API Gateway (local dev)
    - url: https://api.cortaai.shop
      description: API Gateway (produção)

# ==================================================
# LOGGING — silencia spam de bibliotecas internas
# ==================================================
logging:
  level:
    com.netflix.discovery: WARN
    com.netflix.eureka: WARN
    org.springframework.cloud.loadbalancer: WARN

app:
  web-base-url: ${APP_WEB_BASE_URL:https://web.cortaai.shop}
  forgot-password-continue-url: ${APP_FORGOT_PASSWORD_CONTINUE_URL:https://web.cortaai.shop/change-password}
  security:
    crypto:
      # Base64 de uma chave AES de 32 bytes. Gere com: openssl rand -base64 32
      key: ${CORTAAI_DATA_CRYPTO_KEY:}
