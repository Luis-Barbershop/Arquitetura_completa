server:
  port: 8085
  tomcat:
    threads:
      max: 100
      min-spare: 10
    max-connections: 400
    connection-timeout: 20000
  servlet:
    async:
      timeout: 300000   # 5 min — SSE emitter timeout + margem

spring:
  application:
    name: notification-service
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: ${FEIGN_CONNECT_TIMEOUT_MS:10000}
            readTimeout: ${FEIGN_READ_TIMEOUT_MS:60000}
  main:
    lazy-initialization: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/notification_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 600000
  jpa:
    # Hibernate 6+ detecta o dialeto automaticamente pelo driver — não especificar
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 10
        order_inserts: true
        order_updates: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

notification:
  from-email: ${NOTIFICATION_FROM_EMAIL:noreply@cortaai.com.br}
  push:
    enabled: ${NOTIFICATION_PUSH_ENABLED:false}
    service-account-base64: ${NOTIFICATION_PUSH_SERVICE_ACCOUNT_BASE64:}
    service-account-path: ${NOTIFICATION_PUSH_SERVICE_ACCOUNT_PATH:}
    project-id: ${NOTIFICATION_PUSH_PROJECT_ID:}

# ==================================================
# SPRINGDOC / SWAGGER UI
# ==================================================
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  servers:
    - url: ${SPRINGDOC_SERVER_URL:http://localhost:8080}
      description: API Gateway (local dev)
    - url: https://api.cortaai.shop
      description: API Gateway (produção)

# ==================================================
# LOGGING — silencia spam de bibliotecas internas
# ==================================================
logging:
  level:
    com.netflix.discovery: WARN
    com.netflix.eureka: WARN
    org.springframework.cloud.loadbalancer: WARN
