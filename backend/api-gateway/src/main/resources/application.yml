server:
  port: 8080

spring:
  application:
    name: api-gateway
  main:
    lazy-initialization: true
  codec:
    max-in-memory-size: 20MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  cloud:
    loadbalancer:
      cache:
        type: caffeine
        caffeine:
          spec: maximumSize=1000,expireAfterWrite=5s
    gateway:
      # Desabilita o filtro JSON-to-gRPC que causa ClassNotFoundException
      # (Firebase traz grpc-api transitivo mas não grpc-netty)
      filter:
        json-to-grpc:
          enabled: false
      # ══════════════════════════════════════════════════════════════════
      # CORS — Gerenciado AQUI no YAML (única fonte de verdade)
      # NÃO usar CorsConfig.java (Bean CorsWebFilter) junto com isso!
      # ══════════════════════════════════════════════════════════════════
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "*"
            allowedMethods:
              - "*"
            allowedHeaders:
              - "*"
            exposedHeaders:
              - "Authorization"
              - "X-User-UID"
              - "X-User-Email"
              - "X-User-Type"
              - "X-Correlation-Id"
              - "Content-Disposition"
            allowCredentials: true
            maxAge: 600
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin, RETAIN_FIRST
        - name: RequestRateLimiter
          args:
            key-resolver: "#{@userOrIpRateLimitKeyResolver}"
            redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH_RATE:50}
            redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST_CAPACITY:100}
            redis-rate-limiter.requestedTokens: 1
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # ======== ROTAS DE API-DOCS (Swagger) ========
        - id: user-service-api-docs
          uri: lb://user-service
          predicates:
            - Path=/v3/api-docs/user-service
          filters:
            - RewritePath=/v3/api-docs/user-service, /v3/api-docs

        - id: barbershop-service-api-docs
          uri: lb://barbershop-service
          predicates:
            - Path=/v3/api-docs/barbershop-service
          filters:
            - RewritePath=/v3/api-docs/barbershop-service, /v3/api-docs

        - id: schedule-service-api-docs
          uri: lb://schedule-service
          predicates:
            - Path=/v3/api-docs/schedule-service
          filters:
            - RewritePath=/v3/api-docs/schedule-service, /v3/api-docs

        - id: payment-service-api-docs
          uri: lb://payment-service
          predicates:
            - Path=/v3/api-docs/payment-service
          filters:
            - RewritePath=/v3/api-docs/payment-service, /v3/api-docs

        - id: notification-service-api-docs
          uri: lb://notification-service
          predicates:
            - Path=/v3/api-docs/notification-service
          filters:
            - RewritePath=/v3/api-docs/notification-service, /v3/api-docs

        - id: product-service-api-docs
          uri: lb://product-service
          predicates:
            - Path=/v3/api-docs/product-service
          filters:
            - RewritePath=/v3/api-docs/product-service, /v3/api-docs

        # ======== ROTAS DE NEGÓCIO ========

        # Compat: clientes antigos ainda chamam /api/barbershops/{id}/barbers
        # Encaminha para o endpoint canônico no user-service.
        - id: legacy-barbershop-barbers
          uri: lb://user-service
          predicates:
            - Path=/api/barbershops/*/barbers
          filters:
            - RewritePath=/api/barbershops/(?<barbershopId>[^/]+)/barbers, /api/barbers/barbershop/$\{barbershopId}

        # User Service (Auth, Cadastro, Perfil)
        - id: user-auth-sensitive-rate-limit
          uri: lb://user-service
          predicates:
            - Path=/api/auth/email/**, /api/auth/firebase-test/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@authUserOrIpRateLimitKeyResolver}"
                redis-rate-limiter.replenishRate: ${AUTH_RATE_LIMIT_REPLENISH_RATE:10}
                redis-rate-limiter.burstCapacity: ${AUTH_RATE_LIMIT_BURST_CAPACITY:20}
                redis-rate-limiter.requestedTokens: 1

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/customers, /api/customers/**, /api/barbers, /api/barbers/**, /api/auth, /api/auth/**, /api/users, /api/users/**

        # Barbershop Service
        - id: barbershop-service
          uri: lb://barbershop-service
          predicates:
            - Path=/api/barbershops, /api/barbershops/**

        # Schedule Service
        - id: schedule-service
          uri: lb://schedule-service
          predicates:
            - Path=/api/appointments, /api/appointments/**, /api/schedule/**

        # Payment Service
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payments, /api/payments/**

        # Product Service (e-Commerce)
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/products, /api/products/**

        # Notification Service
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications, /api/notifications/**

springdoc:
  swagger-ui:
    use-root-path: true
    urls-primary-name: user-service
  api-docs:
    enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/

# ==================================================
# RATE LIMIT — Gateway Redis token bucket
# Default: 50 req/s, burst 100 por usuario autenticado ou IP.
# Ajuste via RATE_LIMIT_REPLENISH_RATE e RATE_LIMIT_BURST_CAPACITY.
# Endpoints sensiveis de auth: 10 req/s, burst 20 por IP.
# ==================================================
rate-limit:
  replenish-rate: ${RATE_LIMIT_REPLENISH_RATE:50}
  burst-capacity: ${RATE_LIMIT_BURST_CAPACITY:100}
  auth:
    replenish-rate: ${AUTH_RATE_LIMIT_REPLENISH_RATE:10}
    burst-capacity: ${AUTH_RATE_LIMIT_BURST_CAPACITY:20}

# ==================================================
# FIREBASE AUTHENTICATION
# ==================================================
firebase:
  # Deixe vazio — o Firebase é carregado via GOOGLE_APPLICATION_CREDENTIALS
  # (arquivo firebase-service-account.json montado como volume no Docker)
  service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}

# ==================================================
# CORS — Origens permitidas (separadas por vírgula)
# Em produção, defina via variável de ambiente CORS_ALLOWED_ORIGINS
# ==================================================
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}

# ==================================================
# SESSION MIGRATION PILOT (F5-06)
# ==================================================
session:
  cookie:
    enabled: ${SESSION_COOKIE_ENABLED:false}
    name: ${SESSION_COOKIE_NAME:cortaai_session}
  bearer-fallback:
    enabled: ${SESSION_BEARER_FALLBACK_ENABLED:true}

# ==================================================
# LOGGING — silencia spam de bibliotecas internas
# ==================================================
logging:
  level:
    # Eureka: resolve/refresh de cluster → WARN (elimina spam a cada 5 min)
    com.netflix.discovery: WARN
    com.netflix.eureka: WARN
    # Spring Cloud Gateway: reduz verbosidade de rotas
    org.springframework.cloud.gateway: WARN
    # Netty (reactor): silencia logs de baixo nível de rede
    reactor.netty: WARN
    io.netty: WARN
