server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # User Service (Auth, Cadastro, Perfil)
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/customers/**, /api/barbers/**, /api/auth/**

        # Barbershop Service
        - id: barbershop-service
          uri: lb://barbershop-service
          predicates:
            - Path=/api/barbershops/**

        # Schedule Service
        - id: schedule-service
          uri: lb://schedule-service
          predicates:
            - Path=/api/appointments/**

        # Payment Service
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**

        # Product Service (e-Commerce)
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/products/**, /api/orders/**

        # Notification Service
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/

