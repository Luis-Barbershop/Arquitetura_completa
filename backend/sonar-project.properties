sonar.projectKey=ifsp.edu.projeto:cortaai
sonar.projectName=CortaAi
sonar.projectVersion=0.1
sonar.java.source=17
sonar.sourceEncoding=UTF-8

# ── Fontes main ──────────────────────────────────────────────────────────────
sonar.sources=\
  discovery-service/src/main/java,\
  api-gateway/src/main/java,\
  user-service/src/main/java,\
  barbershop-service/src/main/java,\
  schedule-service/src/main/java,\
  payment-service/src/main/java,\
  notification-service/src/main/java,\
  product-service/src/main/java

# ── Fontes de teste ───────────────────────────────────────────────────────────
sonar.tests=\
  discovery-service/src/test/java,\
  api-gateway/src/test/java,\
  user-service/src/test/java,\
  barbershop-service/src/test/java,\
  schedule-service/src/test/java,\
  payment-service/src/test/java,\
  notification-service/src/test/java,\
  product-service/src/test/java

# ── Classes compiladas ────────────────────────────────────────────────────────
sonar.java.binaries=\
  discovery-service/target/classes,\
  api-gateway/target/classes,\
  user-service/target/classes,\
  barbershop-service/target/classes,\
  schedule-service/target/classes,\
  payment-service/target/classes,\
  notification-service/target/classes,\
  product-service/target/classes

sonar.java.test.binaries=\
  discovery-service/target/test-classes,\
  api-gateway/target/test-classes,\
  user-service/target/test-classes,\
  barbershop-service/target/test-classes,\
  schedule-service/target/test-classes,\
  payment-service/target/test-classes,\
  notification-service/target/test-classes,\
  product-service/target/test-classes

# ── Cobertura JaCoCo ──────────────────────────────────────────────────────────
sonar.coverage.jacoco.xmlReportPaths=\
  discovery-service/target/site/jacoco/jacoco.xml,\
  api-gateway/target/site/jacoco/jacoco.xml,\
  user-service/target/site/jacoco/jacoco.xml,\
  barbershop-service/target/site/jacoco/jacoco.xml,\
  schedule-service/target/site/jacoco/jacoco.xml,\
  payment-service/target/site/jacoco/jacoco.xml,\
  notification-service/target/site/jacoco/jacoco.xml,\
  product-service/target/site/jacoco/jacoco.xml

# ── Resultados de testes Surefire ─────────────────────────────────────────────
sonar.junit.reportPaths=\
  discovery-service/target/surefire-reports,\
  api-gateway/target/surefire-reports,\
  user-service/target/surefire-reports,\
  barbershop-service/target/surefire-reports,\
  schedule-service/target/surefire-reports,\
  payment-service/target/surefire-reports,\
  notification-service/target/surefire-reports,\
  product-service/target/surefire-reports

# ── Exclusões (idênticas ao pom.xml) ─────────────────────────────────────────
sonar.exclusions=\
  **/config/**,\
  **/*Application.java,\
  **/dto/**,\
  **/model/**,\
  **/mapper/**,\
  **/messaging/publisher/**

sonar.cpd.exclusions=\
  **/security/crypto/DataCrypto.java,\
  **/exception/ApiErrorResponse.java,\
  **/event/JoinRequestCreatedEvent.java,\
  **/exception/GlobalExceptionHandler.java,\
  **/validator/CPF.java,\
  **/validator/CPFValidator.java,\
  **/repository/CustomerRepository.java,\
  **/repository/BarberRepository.java,\
  **/service/EmailService.java,\
  **/service/AppointmentService.java,\
  **/service/BarbershopService.java,\
  **/controller/MercadoPagoOAuthController.java
