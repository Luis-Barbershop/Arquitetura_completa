server:
  port: 8084
  tomcat:
    threads:
      max: 20
      min-spare: 2
    max-connections: 100

spring:
  application:
    name: payment-service
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  cloud:
    loadbalancer:
      cache:
        type: caffeine
        caffeine:
          spec: maximumSize=1000,expireAfterWrite=5s
  main:
    lazy-initialization: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/payment_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 600000
  jpa:
    # Hibernate 6+ detecta o dialeto automaticamente pelo driver — não especificar
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 10
        order_inserts: true
        order_updates: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

mercadopago:
  auth-base-url: ${MP_AUTH_BASE_URL:https://auth.mercadopago.com.br}
  api-base-url: ${MP_API_BASE_URL:https://api.mercadopago.com}
  post-connect-redirect-url: ${MP_POST_CONNECT_REDIRECT_URL:http://localhost:5173/barberHome?mpLinked=true}
  access-token: ${MP_ACCESS_TOKEN}
  public-key: ${MP_PUBLIC_KEY}
  client-id: ${MP_CLIENT_ID}
  client-secret: ${MP_CLIENT_SECRET:}
  redirect-uri: ${MP_REDIRECT_URI:http://localhost:8080/api/payments/mp-callback}
  notification-url: ${MP_NOTIFICATION_URL:https://api.cortaai.shop/api/payments/webhook}
  marketplace-fee-percent: 5.0
  webhook:
    # Segredo de assinatura do webhook (Mercado Pago) — quando vazio, validação é desativada (compatibilidade local).
    secret: ${MP_WEBHOOK_SECRET:}
    # Janela máxima (segundos) para aceitar assinatura do webhook e mitigar replay.
    replay-window-seconds: ${MP_WEBHOOK_REPLAY_WINDOW_SECONDS:300}

# ==================================================
# SPRINGDOC / SWAGGER UI
# ==================================================
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  servers:
    - url: ${SPRINGDOC_SERVER_URL:http://localhost:8080}
      description: API Gateway (local dev)
    - url: https://api.cortaai.shop
      description: API Gateway (produção)

# ==================================================
# LOGGING — silencia spam de bibliotecas internas
# ==================================================
logging:
  level:
    com.netflix.discovery: WARN
    com.netflix.eureka: WARN
    org.springframework.cloud.loadbalancer: WARN
