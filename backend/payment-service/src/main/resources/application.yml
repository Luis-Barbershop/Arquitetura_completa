server:
  port: 8084
  tomcat:
    threads:
      max: 20
      min-spare: 2
    max-connections: 100

spring:
  application:
    name: payment-service
  main:
    lazy-initialization: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/payment_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 600000
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 10
        order_inserts: true
        order_updates: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

mercadopago:
  access-token: ${MP_ACCESS_TOKEN}
  notification-url: ${MP_NOTIFICATION_URL:http://localhost:8080/api/payments/webhook}
  marketplace-fee-percent: 5.0

# ==================================================
# SPRINGDOC / SWAGGER UI
# ==================================================
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  servers:
    - url: ${SPRINGDOC_SERVER_URL:http://localhost:8080}
      description: API Gateway (local dev)
    - url: https://api.cortaai.shop
      description: API Gateway (produção)

