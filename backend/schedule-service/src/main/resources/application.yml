server:
  port: 8083
  tomcat:
    threads:
      max: 20
      min-spare: 2
    max-connections: 100

spring:
  application:
    name: schedule-service
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  cloud:
    openfeign:
      client:
        config:
          user-service:
            connectTimeout: 2000
            readTimeout: 3000
          barbershop-service:
            connectTimeout: 2000
            readTimeout: 3000
    loadbalancer:
      cache:
        type: caffeine
        caffeine:
          spec: maximumSize=1000,expireAfterWrite=5s
  main:
    lazy-initialization: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/schedule_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 600000
  jpa:
    # Hibernate 6+ detecta o dialeto automaticamente pelo driver — não especificar
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 10
        order_inserts: true
        order_updates: true
        type:
          preferred_uuid_jdbc_type: VARCHAR
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

resilience4j:
  circuitbreaker:
    instances:
      userService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
      barbershopService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
  retry:
    instances:
      userService:
        max-attempts: 3
        wait-duration: 500ms
      barbershopService:
        max-attempts: 3
        wait-duration: 500ms

# ==================================================
# SPRINGDOC / SWAGGER UI
# ==================================================
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  servers:
    - url: ${SPRINGDOC_SERVER_URL:http://localhost:8080}
      description: API Gateway (local dev)
    - url: https://api.cortaai.shop
      description: API Gateway (produção)

# ==================================================
# LOGGING — silencia spam de bibliotecas internas
# ==================================================
logging:
  level:
    com.netflix.discovery: WARN
    com.netflix.eureka: WARN
    org.springframework.cloud.loadbalancer: WARN

app:
  timezone: ${APP_TIMEZONE:America/Sao_Paulo}
  security:
    crypto:
      key: ${CORTAAI_DATA_CRYPTO_KEY:}
