version: '3.8'

services:
  # ======== INFRAESTRUTURA ========

  db:
    image: mysql:8.0
    container_name: cortaai-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - /DATA/cortaai/mysql:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      --innodb-buffer-pool-size=128M
      --innodb-log-buffer-size=8M
      --max-connections=50
      --performance-schema=OFF
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 384M

  rabbitmq:
    image: rabbitmq:3-management
    container_name: cortaai-rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_VM_MEMORY_HIGH_WATERMARK: 0.6
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 300M # Ajustado: 192M causa o erro 'exited (1)' no ZimaOS

  redis:
    image: redis:7-alpine
    container_name: cortaai-redis
    ports:
      - "6380:6379"
    command: redis-server --maxmemory 32mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 48M

  # ======== DISCOVERY & GATEWAY ========

  discovery:
    build:
      context: ./backend
      dockerfile: discovery-service/Dockerfile
    image: cortaai/discovery-service:latest
    container_name: discovery-service
    ports: ["8761:8761"]
    environment:
      - EUREKA_HOST=discovery
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M # Dieta Spring JRE

  gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    image: cortaai/api-gateway:latest
    container_name: api-gateway
    ports: ["8082:8080"]
    environment:
      - EUREKA_HOST=discovery
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON}
    depends_on:
      discovery:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.8"
          memory: 300M

  # ======== MICROSERVIÇOS DE NEGÓCIO ========

  user-service:
    build: { context: ./backend, dockerfile: user-service/Dockerfile }
    image: cortaai/user-service:latest
    container_name: user-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/user_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - EUREKA_HOST=discovery
    depends_on:
      db: { condition: service_healthy }
      discovery: { condition: service_started }
    deploy:
      resources:
        limits: { cpus: "0.8", memory: 300M }

  barbershop-service:
    build: { context: ./backend, dockerfile: barbershop-service/Dockerfile }
    image: cortaai/barbershop-service:latest
    container_name: barbershop-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/barbershop_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - EUREKA_HOST=discovery
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "0.8", memory: 300M }

  schedule-service:
    build: { context: ./backend, dockerfile: schedule-service/Dockerfile }
    image: cortaai/schedule-service:latest
    container_name: schedule-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/schedule_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - EUREKA_HOST=discovery
      - RABBITMQ_HOST=rabbitmq
      - REDIS_HOST=redis
    depends_on:
      db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "0.8", memory: 300M }

  payment-service:
    build: { context: ./backend, dockerfile: payment-service/Dockerfile }
    image: cortaai/payment-service:latest
    container_name: payment-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/payment_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - EUREKA_HOST=discovery
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "0.8", memory: 300M }

  notification-service:
    build: { context: ./backend, dockerfile: notification-service/Dockerfile }
    image: cortaai/notification-service:latest
    container_name: notification-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/notification_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - EUREKA_HOST=discovery
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "0.8", memory: 300M }

  product-service:
    build: { context: ./backend, dockerfile: product-service/Dockerfile }
    image: cortaai/product-service:latest
    container_name: product-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/product_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - EUREKA_HOST=discovery
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "0.8", memory: 256M }

  frontend:
    image: node:20-alpine
    container_name: cortaai-web
    working_dir: /app
    volumes: ["./frontend:/app"]
    ports: ["5173:5173"]
    command: "sh -c 'npm install && npm run dev -- --host'"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M