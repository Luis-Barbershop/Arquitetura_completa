# Arquivo de ambiente de produção: .env.prod (no servidor ZimaOS)
# Uso: docker compose -f docker-compose.server.yml --env-file .env.prod up -d

services:
  # ======== INFRAESTRUTURA ========

  db:
    image: mysql:8.0
    container_name: cortaai-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - /DATA/cortaai/mysql:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      --innodb-buffer-pool-size=128M
      --innodb-log-buffer-size=8M
      --max-connections=50
      --performance-schema=OFF
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 384M

  rabbitmq:
    image: rabbitmq:3-management
    container_name: cortaai-rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      # REMOVIDO: VM_MEMORY_HIGH_WATERMARK (causava erro exited 1)
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 300M 

  redis:
    image: redis:7-alpine
    container_name: cortaai-redis
    ports:
      - "6380:6379"
    command: redis-server --maxmemory 32mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 48M

  # ======== DISCOVERY & GATEWAY ========

  discovery:
    build:
      context: ./backend
      dockerfile: discovery-service/Dockerfile
    image: cortaai/discovery-service:latest
    container_name: discovery-service
    ports: ["8761:8761"]
    environment:
      - EUREKA_HOST=discovery
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M

  gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    image: cortaai/api-gateway:latest
    container_name: api-gateway
    ports: ["8082:8080"]
    volumes:
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    environment:
      - EUREKA_HOST=discovery
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/firebase-service-account.json
      - CORS_ALLOWED_ORIGINS=http://192.168.0.205:5173,http://localhost:5173,http://localhost:3000,https://cortaai.shop,https://web.cortaai.shop
      - EUREKA_CLIENT_REGISTRYFETCHINTERVALSECONDS=5
      - EUREKA_CLIENT_INSTANCEINFOREPLICATIONINTERVALSECONDS=5
    depends_on:
      discovery: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 300M

  # ======== MICROSERVIÇOS DE NEGÓCIO ========

  user-service:
    build: { context: ./backend, dockerfile: user-service/Dockerfile }
    image: cortaai/user-service:latest
    container_name: user-service
    volumes:
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/user_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - EUREKA_HOST=discovery
      - GOOGLE_APPLICATION_CREDENTIALS=/app/firebase-service-account.json
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - CORTAAI_DATA_CRYPTO_KEY=${CORTAAI_DATA_CRYPTO_KEY}
      - SPRINGDOC_SERVER_URL=https://api.cortaai.shop
      - FIREBASE_WEB_API_KEY=${FIREBASE_WEB_API_KEY}
      - EUREKA_INSTANCE_LEASERENEWALINTERVALSECONDS=10
      - EUREKA_INSTANCE_LEASEEXPIRATIONDURATIONSECONDS=30
    depends_on:
      db: { condition: service_healthy }
      discovery: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1", memory: 384M }

  barbershop-service:
    build: { context: ./backend, dockerfile: barbershop-service/Dockerfile }
    image: cortaai/barbershop-service:latest
    container_name: barbershop-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/barbershop_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - EUREKA_HOST=discovery
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASS=${RABBITMQ_PASS}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - CORTAAI_DATA_CRYPTO_KEY=${CORTAAI_DATA_CRYPTO_KEY}
      - SPRINGDOC_SERVER_URL=https://api.cortaai.shop
      - EUREKA_INSTANCE_LEASERENEWALINTERVALSECONDS=10
      - EUREKA_INSTANCE_LEASEEXPIRATIONDURATIONSECONDS=30
      - JAVA_TOOL_OPTIONS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=65.0 -XX:MetaspaceSize=64m -XX:MaxMetaspaceSize=96m
    depends_on:
      db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      discovery: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1", memory: 384M }

  schedule-service:
    build: { context: ./backend, dockerfile: schedule-service/Dockerfile }
    image: cortaai/schedule-service:latest
    container_name: schedule-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/schedule_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - EUREKA_HOST=discovery
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASS=${RABBITMQ_PASS}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CORTAAI_DATA_CRYPTO_KEY=${CORTAAI_DATA_CRYPTO_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      - COHERE_API_KEY=${COHERE_API_KEY:-}
      - COHERE_MODEL=${COHERE_MODEL:-}
      - SPRINGDOC_SERVER_URL=https://api.cortaai.shop
      - EUREKA_INSTANCE_LEASERENEWALINTERVALSECONDS=10
      - EUREKA_INSTANCE_LEASEEXPIRATIONDURATIONSECONDS=30
      - JAVA_TOOL_OPTIONS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=65.0 -XX:MetaspaceSize=64m -XX:MaxMetaspaceSize=96m
    depends_on:
      db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
      discovery: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1", memory: 384M }

  payment-service:
    build: { context: ./backend, dockerfile: payment-service/Dockerfile }
    image: cortaai/payment-service:latest
    container_name: payment-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/payment_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - EUREKA_HOST=discovery
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASS=${RABBITMQ_PASS}
      - MP_ACCESS_TOKEN=${MP_ACCESS_TOKEN}
      - MP_PUBLIC_KEY=${MP_PUBLIC_KEY}
      - MP_CLIENT_ID=${MP_CLIENT_ID}
      - MP_CLIENT_SECRET=${MP_CLIENT_SECRET}
      - MP_REDIRECT_URI=${MP_REDIRECT_URI}
      - MP_AUTH_BASE_URL=${MP_AUTH_BASE_URL}
      - MP_API_BASE_URL=${MP_API_BASE_URL}
      - MP_AUTHORIZATION_API_BASE_URL=${MP_AUTHORIZATION_API_BASE_URL:-https://api.mercadolibre.com}
      - MP_POST_CONNECT_REDIRECT_URL=${MP_POST_CONNECT_REDIRECT_URL}
      - SPRINGDOC_SERVER_URL=https://api.cortaai.shop
      - EUREKA_INSTANCE_LEASERENEWALINTERVALSECONDS=10
      - EUREKA_INSTANCE_LEASEEXPIRATIONDURATIONSECONDS=30
      - JAVA_TOOL_OPTIONS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=65.0 -XX:MetaspaceSize=64m -XX:MaxMetaspaceSize=96m
    depends_on:
      db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      discovery: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1", memory: 384M }

  notification-service:
    build: { context: ./backend, dockerfile: notification-service/Dockerfile }
    image: cortaai/notification-service:latest
    container_name: notification-service
    volumes:
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/notification_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - EUREKA_HOST=discovery
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASS=${RABBITMQ_PASS}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - NOTIFICATION_FROM_EMAIL=${NOTIFICATION_FROM_EMAIL}
      - NOTIFICATION_PUSH_ENABLED=${NOTIFICATION_PUSH_ENABLED:-true}
      - NOTIFICATION_PUSH_SERVICE_ACCOUNT_PATH=/app/firebase-service-account.json
      - NOTIFICATION_PUSH_PROJECT_ID=${NOTIFICATION_PUSH_PROJECT_ID:-cortaai-480b8}
      - SPRINGDOC_SERVER_URL=https://api.cortaai.shop
      - EUREKA_INSTANCE_LEASERENEWALINTERVALSECONDS=10
      - EUREKA_INSTANCE_LEASEEXPIRATIONDURATIONSECONDS=30
      - JAVA_TOOL_OPTIONS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=65.0 -XX:MetaspaceSize=64m -XX:MaxMetaspaceSize=96m
    depends_on:
      db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      discovery: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1", memory: 384M }

  product-service:
    build: { context: ./backend, dockerfile: product-service/Dockerfile }
    image: cortaai/product-service:latest
    container_name: product-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/product_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - EUREKA_HOST=discovery
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASS=${RABBITMQ_PASS}
      - SPRINGDOC_SERVER_URL=https://api.cortaai.shop
      - EUREKA_INSTANCE_LEASERENEWALINTERVALSECONDS=10
      - EUREKA_INSTANCE_LEASEEXPIRATIONDURATIONSECONDS=30
      - JAVA_TOOL_OPTIONS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=65.0 -XX:MetaspaceSize=64m -XX:MaxMetaspaceSize=96m
    depends_on:
      db: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      discovery: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1", memory: 320M }

  # ======== QUALIDADE DE CÓDIGO ========

  sonarqube-db:
    image: postgres:15-alpine
    container_name: sonarqube-db
    environment:
      POSTGRES_USER: ${SONAR_DB_USER:-sonar}
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
      POSTGRES_DB: sonarqube
    volumes:
      - /DATA/cortaai/sonarqube/db:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M

  sonarqube:
    image: sonarqube:10-community
    container_name: sonarqube
    depends_on:
      - sonarqube-db
    ports:
      - "9001:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER:-sonar}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
    volumes:
      - /DATA/cortaai/sonarqube/data:/opt/sonarqube/data
      - /DATA/cortaai/sonarqube/logs:/opt/sonarqube/logs
      - /DATA/cortaai/sonarqube/extensions:/opt/sonarqube/extensions
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Usa caminho relativo — Nginx faz proxy reverso para o gateway
        # Evita CORS cross-origin (web.cortaai.shop → api.cortaai.shop)
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
        - VITE_ENABLE_PWA=${VITE_ENABLE_PWA:-true}
        - VITE_ENABLE_PUSH=${VITE_ENABLE_PUSH:-true}
        - VITE_FIREBASE_VAPID_KEY=${VITE_FIREBASE_VAPID_KEY:-}
        - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
        - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
        - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
        - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
        - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}
        - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
    image: cortaai/frontend:latest
    container_name: cortaai-web
    ports: ["5173:80"]
    depends_on:
      - gateway
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 32M
