services:
  # Banco de Dados (Compartilhado para facilitar o setup inicial)
  db:
    image: mysql:8.0
    container_name: cortaai-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cortaai
    ports:
      - "3306:3306"

  # 1. Discovery Service (Eureka)
  discovery:
    image: eclipse-temurin:17-jdk
    container_name: discovery-service
    working_dir: /app
    volumes: ["./backend/discovery-service:/app"]
    # No início, como não tem o jar, usaremos o mvnw para rodar
    command: "./mvnw spring-boot:run"
    ports: ["8761:8761"]

  # 2. API Gateway
  gateway:
    image: eclipse-temurin:17-jdk
    container_name: api-gateway
    working_dir: /app
    volumes: ["./backend/api-gateway:/app"]
    command: "./mvnw spring-boot:run"
    ports: ["8080:8080"] 
    depends_on: ["discovery"]

  # 3. User Service (Autenticação, Clientes e Barbeiros)
  user-service:
    image: eclipse-temurin:17-jdk
    container_name: user-service
    working_dir: /app
    volumes: ["./backend/user-service:/app"]
    command: "./mvnw spring-boot:run"
    environment:
      - JDBC_DATABASE_URL=jdbc:mysql://db:3306/cortaai
    depends_on: ["db", "discovery"]

  # 4. Frontend (React 19 + Vite 7)
  frontend:
    image: node:20
    container_name: cortaai-web
    working_dir: /app
    volumes: ["./frontend:/app"]
    ports: ["5173:5173"]
    command: "sh -c 'npm install && npm run dev -- --host'"
